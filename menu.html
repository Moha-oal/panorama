<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="عين بانوراما — اطلب من طاولتك.">
  <title>عين بانوراما — القائمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .menu-page .site-header{z-index:20}
    .menu-hero{padding:clamp(28px,5vw,48px) var(--pad) 8px}
    .menu-hero h1{margin:0;font-size:clamp(2rem,4.5vw,2.8rem)}
    .menu-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(260px,340px);
      gap:clamp(28px,4vw,48px);
      align-items:start;
      max-width:1120px;
      margin:0 auto;
      padding:28px var(--pad) 72px;
    }
    .menu-col h2,.order-panel h2{margin:0 0 18px;font-size:1.55rem}
    .menu-list{list-style:none;margin:0;padding:0}
    .menu-item{
      display:flex;
      align-items:center;
      gap:16px;
      padding:18px 0;
      border-bottom:1px solid var(--line);
      min-width:0;
    }
    .menu-item:last-child{border-bottom:0}
    .item-thumb{
      width:72px;height:72px;flex-shrink:0;
      border-radius:2px;border:1px solid var(--line);
      background:var(--night-2);overflow:hidden;
    }
    .item-thumb img{display:block;width:100%;height:100%;object-fit:cover}
    .item-copy{min-width:0;flex:1}
    .item-copy h3{margin:0;font-size:20px;line-height:1.4}
    .item-latin{display:block;margin-top:2px;color:var(--sand-dim);font-size:13px;unicode-bidi:isolate}
    .item-price{margin:6px 0 0;color:var(--brass);font-size:15px}
    .item-action{flex-shrink:0}
    .btn-add{
      background:transparent;color:var(--brass);border:1px solid var(--brass);
      border-radius:2px;padding:8px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;
    }
    .btn-add:hover{background:var(--brass);color:#17120A}
    .stepper{display:flex;align-items:center;gap:8px}
    .stepper button{
      width:32px;height:32px;padding:0;border:1px solid var(--brass);border-radius:2px;
      background:transparent;color:var(--brass);font:inherit;font-size:18px;line-height:1;cursor:pointer;
    }
    .stepper button:hover{background:var(--brass);color:#17120A}
    .stepper .qty{display:inline-block;min-width:1.2em;text-align:center}

    .order-panel{
      position:sticky;top:24px;
      background:var(--night-2);border:1px solid var(--line);border-radius:2px;
      padding:22px 20px;min-width:0;
    }
    .order-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
    .order-head h2{margin:0}
    .order-count{color:var(--sand-dim);font-size:15px}
    #cart-empty{color:var(--sand-dim);margin:0 0 20px}
    #cart-list{list-style:none;margin:0 0 16px;padding:0}
    .cart-line{
      display:grid;
      grid-template-columns:auto minmax(12px,1fr) auto auto;
      gap:8px;
      align-items:baseline;
      padding:8px 0;
      min-width:0;
    }
    .cart-name{min-width:0}
    .cart-leader{border-bottom:1px dotted var(--brass-deep);min-width:12px;transform:translateY(-4px)}
    .cart-qty,.cart-sum{color:var(--sand-dim)}
    .cart-sum{color:var(--brass)}
    .hidden{display:none !important}
    #cart-total-wrap{
      display:flex;align-items:baseline;justify-content:space-between;gap:12px;
      border-top:1px solid var(--line);padding-top:14px;margin:8px 0 18px;
    }
    #cart-total{margin:0;color:var(--brass);font-size:20px}
    .pay{border:0;margin:0 0 18px;padding:0}
    .pay legend{padding:0;margin:0 0 10px;font-size:15px;color:var(--sand-dim)}
    .pay-row{display:flex;flex-wrap:wrap;gap:10px}
    .pay-chip{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--line);border-radius:2px;padding:8px 14px;cursor:pointer;
    }
    .pay-chip input{
      appearance:none;width:8px;height:8px;margin:0;border-radius:50%;
      border:1px solid var(--brass);background:transparent;flex-shrink:0;
    }
    .pay-chip input:checked{background:var(--brass)}
    .pay-chip:has(input:checked){border-color:var(--brass)}
    #order-note{min-height:1.4em;margin:0 0 12px;color:var(--sand-dim);font-size:14px}
    #send-order{
      width:100%;border:0;border-radius:2px;padding:11px 22px;
      background:var(--brass);color:#17120A;font:inherit;font-size:15px;font-weight:500;cursor:pointer;
    }
    #send-order:hover:not(:disabled){background:var(--brass-deep);color:var(--sand)}
    #send-order:disabled{
      background:var(--night-2);color:var(--sand-dim);cursor:not-allowed;border:1px solid var(--line);
    }

    #order-modal{
      position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
      padding:24px;opacity:0;pointer-events:none;
      transition:opacity .45s cubic-bezier(.16,1,.3,1);
    }
    #order-modal.is-open{opacity:1;pointer-events:auto}
    .modal-scrim{position:absolute;inset:0;background:rgba(18,16,13,.72)}
    #order-modal-card{
      position:relative;width:100%;max-width:400px;background:var(--night-2);color:var(--sand);
      border:1px solid var(--line);border-radius:2px;padding:40px 32px;text-align:center;
      opacity:0;transform:translateY(12px);
      transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
    }
    #order-modal.is-open #order-modal-card{opacity:1;transform:none}
    .modal-check{
      display:flex;align-items:center;justify-content:center;
      width:52px;height:52px;margin:0 auto 20px;border:1px solid var(--brass);border-radius:50%;
    }
    #order-modal-title{margin:0;font-family:var(--ar-display);font-size:1.35rem}

    @media (max-width:900px){
      .menu-layout{grid-template-columns:1fr;padding-bottom:0}
      .menu-col{padding-bottom:128px}
      .order-panel{position:static;background:transparent;border:0;padding:0}
      .order-body{padding-bottom:12px}
      .order-dock{
        position:fixed;bottom:0;left:0;right:0;z-index:15;
        display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
        background:var(--night);border-top:1px solid var(--line);
        padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));
      }
      #cart-total-wrap{margin:0;padding:0;border:0;flex:1;min-width:0}
      #send-order{width:auto;flex:0 0 auto;min-width:42%}
      #order-note{width:100%;margin:0}
    }
    @media (prefers-reduced-motion:reduce){
      #order-modal,#order-modal-card{transition:none}
    }
  </style>
</head>
<body class="menu-page">

  <header class="site-header">
    <a class="wordmark" href="index.html">عين بانوراما</a>
    <p id="table-label">الطاولة <span class="num" dir="ltr">—</span></p>
  </header>

  <div class="menu-hero">
    <h1>اطلب من طاولتك</h1>
  </div>

  <div class="menu-layout">
    <section class="menu-col" aria-labelledby="menu-heading">
      <h2 id="menu-heading">الأصناف</h2>
      <ul id="menu-list" class="menu-list"></ul>
    </section>

    <aside class="order-panel" aria-labelledby="cart-heading" aria-live="polite">
      <div class="order-body">
        <div class="order-head">
          <h2 id="cart-heading">طلبك</h2>
          <span id="cart-count" class="order-count num" dir="ltr">0</span>
        </div>

        <div id="cart-empty">لا شيء بعد. أضِف ما يعجبك.</div>
        <ul id="cart-list" class="hidden"></ul>

        <fieldset class="pay">
          <legend>الدفع</legend>
          <div class="pay-row">
            <label class="pay-chip">
              <input type="radio" name="payment" value="Cash" checked>
              نقداً
            </label>
            <label class="pay-chip">
              <input type="radio" name="payment" value="Card">
              بطاقة
            </label>
          </div>
        </fieldset>
      </div>

      <div class="order-dock">
        <div id="cart-total-wrap">
          <span>الإجمالي</span>
          <p id="cart-total"><span class="num" dir="ltr">0</span> ر.س</p>
        </div>
        <p id="order-note" role="status"></p>
        <button type="button" id="send-order" disabled>إرسال الطلب</button>
      </div>
    </aside>
  </div>

  <div id="order-modal" role="dialog" aria-modal="true" aria-labelledby="order-modal-title" aria-hidden="true">
    <div class="modal-scrim"></div>
    <div id="order-modal-card">
      <div class="modal-check" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
          <path d="M6 13.2 L11.1 18.1 L20 7.8" stroke="#CB9C46" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p id="order-modal-title">تم إرسال طلبك بنجاح! جاري التحضير...</p>
    </div>
  </div>

  <script>
    (function () {
      var MENU = [
        { id: 'v60', name: 'V60', nameAr: 'في ٦٠', price: 20, image: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?q=80&w=400&auto=format&fit=crop' },
        { id: 'spanish-latte', name: 'Spanish Latte', nameAr: 'لاتيه إسباني', price: 22, image: 'https://images.unsplash.com/photo-1579992357154-faf4bde95b3d?q=80&w=400&auto=format&fit=crop' },
        { id: 'espresso', name: 'Espresso', nameAr: 'إسبريسو', price: 15, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?q=80&w=400&auto=format&fit=crop' },
        { id: 'tiramisu', name: 'Tiramisu', nameAr: 'تيراميسو', price: 25, image: 'https://images.unsplash.com/photo-1571115177098-24ec42ed204d?q=80&w=400&auto=format&fit=crop' }
      ];

      var cart = {};
      var table = parseTable(window.location.search);
      var clearTimer = null;

      var tableLabel = document.getElementById('table-label');
      var menuList = document.getElementById('menu-list');
      var cartList = document.getElementById('cart-list');
      var cartEmpty = document.getElementById('cart-empty');
      var cartTotal = document.getElementById('cart-total');
      var cartCount = document.getElementById('cart-count');
      var sendBtn = document.getElementById('send-order');
      var orderNote = document.getElementById('order-note');
      var modal = document.getElementById('order-modal');

      setTableLabel(table);
      renderMenu();
      renderCart();

      sendBtn.addEventListener('click', sendOrder);

      function parseTable(search) {
        var raw = new URLSearchParams(search).get('table');
        if (raw && /^[A-Za-z0-9-]{1,8}$/.test(raw.trim())) return raw.trim();
        return '—';
      }

      function setTableLabel(value) {
        tableLabel.replaceChildren();
        tableLabel.appendChild(document.createTextNode('الطاولة '));
        var num = document.createElement('span');
        num.className = 'num';
        num.dir = 'ltr';
        num.textContent = value;
        tableLabel.appendChild(num);
      }

      function cartItems() {
        return MENU.filter(function (item) { return cart[item.id] > 0; })
          .map(function (item) {
            return { item: item, qty: cart[item.id] };
          });
      }

      function cartQtyTotal() {
        return cartItems().reduce(function (sum, row) { return sum + row.qty; }, 0);
      }

      function cartTotalValue() {
        return cartItems().reduce(function (sum, row) {
          return sum + row.item.price * row.qty;
        }, 0);
      }

      function addToCart(id) {
        cart[id] = (cart[id] || 0) + 1;
        renderCart();
      }

      function setQty(id, qty) {
        if (qty <= 0) delete cart[id];
        else cart[id] = qty;
        renderCart();
      }

      function selectedPayment() {
        var chosen = document.querySelector('input[name="payment"]:checked');
        return chosen ? chosen.value : '';
      }

      function collectOrderDetails() {
        return {
          table: table,
          payment: selectedPayment(),
          items: cartItems().map(function (row) {
            return {
              id: row.item.id,
              name: row.item.name,
              nameAr: row.item.nameAr,
              qty: row.qty,
              price: row.item.price
            };
          }),
          total: cartTotalValue()
        };
      }

      function formatOrderArabic(orderDetails) {
        var paymentAr = orderDetails.payment === 'Card' ? 'بطاقة' : 'نقداً';
        var lines = orderDetails.items.map(function (item) {
          return '• ' + item.nameAr + ' × ' + item.qty;
        }).join('\n');

        return [
          '☕ طلب جديد - بانوراما ☕',
          'الطاولة: ' + orderDetails.table,
          'الطلبات:',
          lines,
          'الإجمالي: ' + orderDetails.total + ' ريال',
          'طريقة الدفع: ' + paymentAr
        ].join('\n');
      }

      async function sendOrderToBackend(orderDetails) {
        var TELEGRAM_BOT_TOKEN = '8183452919:AAEdzH2rPBFecpUBXiHujrXZBLuE3trMaJg';
        var TELEGRAM_CHAT_ID = '8012123294';
        var formattedOrderString = formatOrderArabic(orderDetails);

        var response = await fetch(
          'https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: formattedOrderString
            })
          }
        );

        var payload = await response.json().catch(function () { return {}; });
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.description || 'Order could not be delivered.');
        }

        return payload;
      }

      function showSuccessModal() {
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
      }

      function hideSuccessModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
      }

      function clearCart() {
        cart = {};
        renderCart();
      }

      async function sendOrder(event) {
        if (event) event.preventDefault();
        orderNote.textContent = '';

        if (!cartItems().length) {
          orderNote.textContent = 'لا شيء بعد. أضِف ما يعجبك.';
          return;
        }

        if (!selectedPayment()) {
          orderNote.textContent = 'اختر نقداً أو بطاقة.';
          return;
        }

        var orderDetails = collectOrderDetails();
        sendBtn.disabled = true;

        try {
          await sendOrderToBackend(orderDetails);
        } catch (err) {
          sendBtn.disabled = false;
          orderNote.textContent = 'تعذّر إرسال الطلب. حاول مرة أخرى.';
          return;
        }

        showSuccessModal();

        if (clearTimer) window.clearTimeout(clearTimer);
        clearTimer = window.setTimeout(function () {
          clearCart();
          hideSuccessModal();
          clearTimer = null;
        }, 3000);
      }

      function priceNode(value) {
        var wrap = document.createElement('span');
        var num = document.createElement('span');
        num.className = 'num';
        num.dir = 'ltr';
        num.textContent = String(value);
        wrap.append(num, document.createTextNode(' ر.س'));
        return wrap;
      }

      function renderMenu() {
        menuList.replaceChildren();

        MENU.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'menu-item';
          li.setAttribute('data-id', item.id);

          var thumb = document.createElement('div');
          thumb.className = 'item-thumb';
          var img = document.createElement('img');
          img.src = item.image;
          img.alt = item.nameAr;
          img.width = 72;
          img.height = 72;
          img.loading = 'lazy';
          img.addEventListener('error', function () { img.style.display = 'none'; });
          thumb.appendChild(img);

          var copy = document.createElement('div');
          copy.className = 'item-copy';

          var nameAr = document.createElement('h3');
          nameAr.textContent = item.nameAr;

          var nameEn = document.createElement('span');
          nameEn.className = 'item-latin';
          nameEn.dir = 'ltr';
          nameEn.textContent = item.name;

          var price = document.createElement('p');
          price.className = 'item-price';
          price.appendChild(priceNode(item.price));

          copy.append(nameAr, nameEn, price);

          var action = document.createElement('div');
          action.className = 'item-action';

          li.append(thumb, copy, action);
          menuList.appendChild(li);
        });

        updateItemActions();
      }

      function updateItemActions() {
        MENU.forEach(function (item) {
          var slot = menuList.querySelector('[data-id="' + item.id + '"] .item-action');
          if (!slot) return;
          var qty = cart[item.id] || 0;
          slot.replaceChildren();

          if (qty === 0) {
            var addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'btn-add';
            addBtn.textContent = 'أضِف';
            addBtn.setAttribute('aria-label', 'أضِف ' + item.nameAr);
            addBtn.addEventListener('click', function () { addToCart(item.id); });
            slot.appendChild(addBtn);
            return;
          }

          var stepper = document.createElement('div');
          stepper.className = 'stepper';

          var minus = document.createElement('button');
          minus.type = 'button';
          minus.setAttribute('aria-label', 'إنقاص ' + item.nameAr);
          minus.textContent = '−';
          minus.addEventListener('click', function () { setQty(item.id, qty - 1); });

          var qtyEl = document.createElement('span');
          qtyEl.className = 'qty num';
          qtyEl.dir = 'ltr';
          qtyEl.textContent = String(qty);

          var plus = document.createElement('button');
          plus.type = 'button';
          plus.setAttribute('aria-label', 'زيادة ' + item.nameAr);
          plus.textContent = '+';
          plus.addEventListener('click', function () { setQty(item.id, qty + 1); });

          stepper.append(minus, qtyEl, plus);
          slot.appendChild(stepper);
        });
      }

      function renderCart() {
        var rows = cartItems();
        var empty = rows.length === 0;

        cartEmpty.classList.toggle('hidden', !empty);
        cartList.classList.toggle('hidden', empty);
        sendBtn.disabled = empty;
        cartCount.textContent = String(cartQtyTotal());

        cartList.replaceChildren();
        cartTotal.replaceChildren(priceNode(cartTotalValue()));

        rows.forEach(function (row) {
          var item = row.item;
          var li = document.createElement('li');
          li.className = 'cart-line';

          var name = document.createElement('span');
          name.className = 'cart-name';
          name.textContent = item.nameAr;

          var leader = document.createElement('span');
          leader.className = 'cart-leader';
          leader.setAttribute('aria-hidden', 'true');

          var qty = document.createElement('span');
          qty.className = 'cart-qty num';
          qty.dir = 'ltr';
          qty.textContent = String(row.qty);

          var sum = document.createElement('span');
          sum.className = 'cart-sum';
          sum.appendChild(priceNode(item.price * row.qty));

          li.append(name, leader, qty, sum);
          cartList.appendChild(li);
        });

        updateItemActions();
      }
    })();
  </script>
</body>
</html>
