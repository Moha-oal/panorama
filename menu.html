<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panorama — order from your table. Specialty coffee, prepared at the bar.">
  <title>Panorama — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F6F4EE',
            espresso: '#2C1E16',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', '"Times New Roman"', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            arabic: ['Cairo', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    #order-modal{transition:opacity .45s cubic-bezier(.16,1,.3,1)}
    #order-modal.is-open{opacity:1;pointer-events:auto}
    #order-modal-card{transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1)}
    #order-modal.is-open #order-modal-card{opacity:1;transform:none}
    @media (prefers-reduced-motion:reduce){
      #order-modal,#order-modal-card{transition:none}
    }
  </style>
</head>
<body class="bg-cream text-espresso antialiased min-h-screen">

  <header class="flex items-center justify-between gap-6 px-8 sm:px-12 md:px-16 lg:px-24 pt-8 pb-4">
    <a href="index.html" class="font-sans text-[13px] font-medium uppercase tracking-[0.42em]">Panorama</a>
    <p id="table-label" class="font-sans text-[11px] font-medium uppercase tracking-[0.28em] text-espresso/70">Table: —</p>
  </header>

  <main class="px-8 sm:px-12 md:px-16 lg:px-24 pb-20 pt-10 md:pt-14">
    <div class="mx-auto w-full max-w-[1100px]">

      <div class="max-w-xl">
        <p class="font-sans text-[11px] font-medium uppercase tracking-[0.32em] text-espresso/70">
          The Menu
          <span class="font-arabic inline-block align-middle normal-case tracking-normal text-[13px] ltr:ml-3" dir="rtl" lang="ar">القائمة</span>
        </p>
        <h1 class="font-serif font-normal text-4xl sm:text-5xl md:text-6xl leading-[1.1] tracking-[-0.015em] mt-6">
          Order from <em class="italic font-normal">your table</em>.
        </h1>
      </div>

      <hr class="mt-12 mb-14 border-0 h-px w-full bg-espresso/15">

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-20 xl:gap-24 items-start">

        <section aria-labelledby="menu-heading">
          <h2 id="menu-heading" class="font-sans text-[11px] font-medium uppercase tracking-[0.28em] text-espresso/70 mb-8">
            Selection
          </h2>
          <ul id="menu-list" class="divide-y divide-espresso/10"></ul>
        </section>

        <aside class="lg:sticky lg:top-10" aria-labelledby="cart-heading">
          <h2 id="cart-heading" class="font-sans text-[11px] font-medium uppercase tracking-[0.28em] text-espresso/70 mb-8">
            Your order
            <span class="font-arabic inline-block align-middle normal-case tracking-normal text-[13px] ltr:ml-3" dir="rtl" lang="ar">طلبك</span>
          </h2>

          <div id="cart-empty" class="text-[15px] leading-relaxed text-espresso/55 mb-10">
            Nothing yet. Add a cup when you are ready.
          </div>

          <ul id="cart-list" class="divide-y divide-espresso/10 mb-8 hidden"></ul>

          <div id="cart-total-wrap" class="hidden border-t border-espresso/20 pt-6 mb-10">
            <div class="flex items-baseline justify-between gap-6">
              <span class="font-sans text-[11px] font-medium uppercase tracking-[0.24em] text-espresso/70">Total</span>
              <p id="cart-total" class="font-serif text-3xl tracking-[-0.02em]">0 SAR</p>
            </div>
          </div>

          <fieldset class="mb-10">
            <legend class="font-sans text-[11px] font-medium uppercase tracking-[0.28em] text-espresso/70 mb-5">
              Payment
              <span class="font-arabic inline-block align-middle normal-case tracking-normal text-[13px] ltr:ml-3" dir="rtl" lang="ar">الدفع</span>
            </legend>
            <div class="flex flex-wrap gap-8">
              <label class="inline-flex items-center gap-3 cursor-pointer text-[15px]">
                <input type="radio" name="payment" value="Cash" class="accent-[#2C1E16] w-4 h-4" checked>
                <span>Cash <span class="font-arabic text-espresso/60" dir="rtl" lang="ar">نقداً</span></span>
              </label>
              <label class="inline-flex items-center gap-3 cursor-pointer text-[15px]">
                <input type="radio" name="payment" value="Card" class="accent-[#2C1E16] w-4 h-4">
                <span>Card <span class="font-arabic text-espresso/60" dir="rtl" lang="ar">بطاقة</span></span>
              </label>
            </div>
          </fieldset>

          <p id="order-note" class="text-[14px] text-espresso/55 mb-5 min-h-[1.5em]" role="status" aria-live="polite"></p>

          <button
            type="button"
            id="send-order"
            class="w-full border border-espresso bg-espresso text-cream font-sans text-[12px] font-medium uppercase tracking-[0.28em] py-4 px-6 transition-opacity duration-300 hover:opacity-90 disabled:opacity-30 disabled:cursor-not-allowed"
          >
            Send Order
          </button>
        </aside>

      </div>
    </div>
  </main>

  <div
    id="order-modal"
    class="fixed inset-0 z-50 flex items-center justify-center px-6 opacity-0 pointer-events-none"
    role="dialog"
    aria-modal="true"
    aria-labelledby="order-modal-title"
    aria-hidden="true"
  >
    <div class="absolute inset-0 bg-[#2C1E16]/20"></div>
    <div id="order-modal-card" class="relative w-full max-w-[420px] bg-cream text-espresso px-10 py-14 text-center opacity-0 translate-y-3">
      <div class="mx-auto mb-8 flex h-14 w-14 items-center justify-center rounded-full border border-[#6B7F5A]/35">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M6 13.2 L11.1 18.1 L20 7.8" stroke="#6B7F5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p id="order-modal-title" class="font-arabic text-[1.35rem] leading-[1.9] font-medium" dir="rtl" lang="ar">
        تم إرسال طلبك بنجاح! جاري التحضير...
      </p>
    </div>
  </div>

  <script>
    (function () {
      var MENU = [
        { id: 'v60', name: 'V60', nameAr: 'في ٦٠', price: 20 },
        { id: 'spanish-latte', name: 'Spanish Latte', nameAr: 'لاتيه إسباني', price: 22 },
        { id: 'espresso', name: 'Espresso', nameAr: 'إسبريسو', price: 15 },
        { id: 'tiramisu', name: 'Tiramisu', nameAr: 'تيراميسو', price: 25 }
      ];

      var cart = {};
      var table = parseTable(window.location.search);
      var clearTimer = null;

      var tableLabel = document.getElementById('table-label');
      var menuList = document.getElementById('menu-list');
      var cartList = document.getElementById('cart-list');
      var cartEmpty = document.getElementById('cart-empty');
      var cartTotalWrap = document.getElementById('cart-total-wrap');
      var cartTotal = document.getElementById('cart-total');
      var sendBtn = document.getElementById('send-order');
      var orderNote = document.getElementById('order-note');
      var modal = document.getElementById('order-modal');

      tableLabel.textContent = 'Table: ' + table;
      renderMenu();
      renderCart();

      sendBtn.addEventListener('click', sendOrder);

      function parseTable(search) {
        var raw = new URLSearchParams(search).get('table');
        if (raw && /^[A-Za-z0-9-]{1,8}$/.test(raw.trim())) return raw.trim();
        return '—';
      }

      function cartItems() {
        return MENU.filter(function (item) { return cart[item.id] > 0; })
          .map(function (item) {
            return { item: item, qty: cart[item.id] };
          });
      }

      function cartTotalValue() {
        return cartItems().reduce(function (sum, row) {
          return sum + row.item.price * row.qty;
        }, 0);
      }

      function addToCart(id) {
        cart[id] = (cart[id] || 0) + 1;
        renderCart();
      }

      function setQty(id, qty) {
        if (qty <= 0) delete cart[id];
        else cart[id] = qty;
        renderCart();
      }

      function selectedPayment() {
        var chosen = document.querySelector('input[name="payment"]:checked');
        return chosen ? chosen.value : '';
      }

      function collectOrderDetails() {
        return {
          table: table,
          payment: selectedPayment(),
          items: cartItems().map(function (row) {
            return {
              id: row.item.id,
              name: row.item.name,
              nameAr: row.item.nameAr,
              qty: row.qty,
              price: row.item.price
            };
          }),
          total: cartTotalValue()
        };
      }

      function formatOrderArabic(orderDetails) {
        var paymentAr = orderDetails.payment === 'Card' ? 'بطاقة' : 'نقداً';
        var lines = orderDetails.items.map(function (item) {
          return '• ' + item.nameAr + ' × ' + item.qty;
        }).join('\n');

        return [
          '☕ طلب جديد - بانوراما ☕',
          'الطاولة: ' + orderDetails.table,
          'الطلبات:',
          lines,
          'الإجمالي: ' + orderDetails.total + ' ريال',
          'طريقة الدفع: ' + paymentAr
        ].join('\n');
      }

      async function sendOrderToBackend(orderDetails) {
        var TELEGRAM_BOT_TOKEN = '8183452919:AAEdzH2rPBFecpUBXiHujrXZBLuE3trMaJg';
        var TELEGRAM_CHAT_ID = '8012123294';
        var formattedOrderString = formatOrderArabic(orderDetails);

        var response = await fetch(
          'https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: formattedOrderString
            })
          }
        );

        var payload = await response.json().catch(function () { return {}; });
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.description || 'Order could not be delivered.');
        }

        return payload;
      }

      function showSuccessModal() {
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
      }

      function hideSuccessModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
      }

      function clearCart() {
        cart = {};
        renderCart();
      }

      async function sendOrder(event) {
        if (event) event.preventDefault();
        orderNote.textContent = '';

        if (!cartItems().length) {
          orderNote.textContent = 'Add something to the tray first.';
          return;
        }

        if (!selectedPayment()) {
          orderNote.textContent = 'Choose cash or card.';
          return;
        }

        var orderDetails = collectOrderDetails();
        sendBtn.disabled = true;

        try {
          await sendOrderToBackend(orderDetails);
        } catch (err) {
          sendBtn.disabled = false;
          orderNote.textContent = 'The order could not be sent. Please try again.';
          return;
        }

        showSuccessModal();

        if (clearTimer) window.clearTimeout(clearTimer);
        clearTimer = window.setTimeout(function () {
          clearCart();
          hideSuccessModal();
          clearTimer = null;
        }, 3000);
      }

      function renderMenu() {
        menuList.replaceChildren();

        MENU.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'py-7 first:pt-0 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4';

          var copy = document.createElement('div');

          var name = document.createElement('h3');
          name.className = 'font-serif text-[1.65rem] leading-tight tracking-[-0.015em]';
          name.textContent = item.name;

          var nameAr = document.createElement('p');
          nameAr.className = 'font-arabic text-[15px] text-espresso/55 mt-1';
          nameAr.dir = 'rtl';
          nameAr.lang = 'ar';
          nameAr.textContent = item.nameAr;

          var price = document.createElement('p');
          price.className = 'font-sans text-[13px] tracking-[0.08em] mt-3 text-espresso/70';
          price.textContent = item.price + ' SAR';

          copy.append(name, nameAr, price);

          var addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'self-start shrink-0 whitespace-nowrap border border-espresso/25 px-4 py-2.5 font-sans text-[10px] font-medium uppercase tracking-[0.22em] hover:border-espresso hover:bg-espresso hover:text-cream transition-colors duration-300';
          addBtn.textContent = 'Add to Cart';
          addBtn.addEventListener('click', function () { addToCart(item.id); });

          li.append(copy, addBtn);
          menuList.appendChild(li);
        });
      }

      function renderCart() {
        var rows = cartItems();
        var empty = rows.length === 0;

        cartEmpty.classList.toggle('hidden', !empty);
        cartList.classList.toggle('hidden', empty);
        cartTotalWrap.classList.toggle('hidden', empty);
        sendBtn.disabled = empty;

        cartList.replaceChildren();
        cartTotal.textContent = cartTotalValue() + ' SAR';

        rows.forEach(function (row) {
          var item = row.item;
          var li = document.createElement('li');
          li.className = 'py-5 first:pt-0 flex items-center justify-between gap-4';

          var copy = document.createElement('div');
          var name = document.createElement('p');
          name.className = 'font-serif text-xl tracking-[-0.01em]';
          name.textContent = item.name;

          var line = document.createElement('p');
          line.className = 'font-sans text-[13px] text-espresso/55 mt-1';
          line.textContent = (item.price * row.qty) + ' SAR';
          copy.append(name, line);

          var stepper = document.createElement('div');
          stepper.className = 'flex items-center gap-3 shrink-0';

          var minus = document.createElement('button');
          minus.type = 'button';
          minus.className = 'w-8 h-8 border border-espresso/20 text-sm hover:border-espresso transition-colors';
          minus.setAttribute('aria-label', 'Remove one ' + item.name);
          minus.textContent = '−';
          minus.addEventListener('click', function () { setQty(item.id, row.qty - 1); });

          var qty = document.createElement('span');
          qty.className = 'w-5 text-center font-sans text-[14px] tabular-nums';
          qty.textContent = String(row.qty);

          var plus = document.createElement('button');
          plus.type = 'button';
          plus.className = 'w-8 h-8 border border-espresso/20 text-sm hover:border-espresso transition-colors';
          plus.setAttribute('aria-label', 'Add one ' + item.name);
          plus.textContent = '+';
          plus.addEventListener('click', function () { setQty(item.id, row.qty + 1); });

          stepper.append(minus, qty, plus);
          li.append(copy, stepper);
          cartList.appendChild(li);
        });
      }
    })();
  </script>
</body>
</html>
